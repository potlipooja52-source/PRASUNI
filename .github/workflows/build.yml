
name: Build PRASUNI APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        run: |
          unzip -o "PRASUNI-project-7.zip" -d extracted

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          FILE=$(find extracted -type f -name settings.gradle.kts -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle.kts not found in ZIP"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          if [ ! -f "$DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p "${{ steps.locate.outputs.dir }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prasuni-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
